name: AI CD

on:
  workflow_dispatch:
  push:
    branches: [develop, 'release/**', main]
    paths-ignore:
      - "**.md"
      - ".github/**"
      - ".git*"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  # ----------------------------
  # 1. Build & Push (Matrix x5)
  # ----------------------------
  build-push:
    name: Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api_server
            ecr_repo: scuad-ai-api
            dockerfile: ./Dockerfile
            target: runtime
          - service: worker_resume
            ecr_repo: scuad-ai-worker-resume
            dockerfile: ./pipelines/resume_analysis/Dockerfile
            target: production
          - service: worker_job
            ecr_repo: scuad-ai-worker-job
            dockerfile: ./pipelines/job_analysis/Dockerfile
            target: production
          - service: worker_evaluate
            ecr_repo: scuad-ai-worker-evaluate
            dockerfile: ./pipelines/applicant_evaluation/Dockerfile
            target: production
          - service: worker_compare
            ecr_repo: scuad-ai-worker-compare
            dockerfile: ./pipelines/candidate_comparison/Dockerfile
            target: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set deploy config
        id: config
        run: |
          SHA_SHORT="${GITHUB_SHA::7}"
          BRANCH="${GITHUB_REF_NAME}"

          if [[ "$BRANCH" == release/* ]]; then
            echo "tag_latest=staging-latest" >> $GITHUB_OUTPUT
            echo "tag_sha=staging-${SHA_SHORT}" >> $GITHUB_OUTPUT
          elif [ "$BRANCH" == "main" ]; then
            echo "tag_latest=main-latest" >> $GITHUB_OUTPUT
            echo "tag_sha=main-${SHA_SHORT}" >> $GITHUB_OUTPUT
          else
            echo "tag_latest=develop-latest" >> $GITHUB_OUTPUT
            echo "tag_sha=develop-${SHA_SHORT}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.ecr_repo }}:${{ steps.config.outputs.tag_latest }}
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.ecr_repo }}:${{ steps.config.outputs.tag_sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ----------------------------
  # 2. Discord 알림
  # ----------------------------
  notify:
    name: Notify Discord
    runs-on: ubuntu-latest
    needs: [build-push]
    if: always()

    steps:
      - name: Set env label
        id: config
        run: |
          SHA_SHORT="${GITHUB_SHA::7}"
          BRANCH="${GITHUB_REF_NAME}"

          if [[ "$BRANCH" == release/* ]]; then
            echo "tag_sha=staging-${SHA_SHORT}" >> $GITHUB_OUTPUT
            echo "env_label=STAGING" >> $GITHUB_OUTPUT
          elif [ "$BRANCH" == "main" ]; then
            echo "tag_sha=main-${SHA_SHORT}" >> $GITHUB_OUTPUT
            echo "env_label=PROD" >> $GITHUB_OUTPUT
          else
            echo "tag_sha=develop-${SHA_SHORT}" >> $GITHUB_OUTPUT
            echo "env_label=DEV" >> $GITHUB_OUTPUT
          fi

      - name: Notify Discord - Success
        if: needs.build-push.result == 'success'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: success
          title: "[${{ steps.config.outputs.env_label }}] AI 이미지 푸시 완료"
          description: |
            Tag: `${{ steps.config.outputs.tag_sha }}`
            Services: api, worker_resume, worker_job, worker_evaluate, worker_compare

      - name: Notify Discord - Failure
        if: needs.build-push.result == 'failure'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: failure
          title: "[${{ steps.config.outputs.env_label }}] AI 이미지 푸시 실패"
          description: |
            Tag: `${{ steps.config.outputs.tag_sha }}`
