name: AI CI

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, 'release/**']
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "**.md"
      - ".github/**"
      - ".git*"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  # ----------------------------
  # 1. Build Dev Image & Run Tests
  # ----------------------------
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set config
        id: config
        run: |
          BRANCH="${{ github.base_ref || github.ref_name }}"
          if [[ "$BRANCH" == release/* ]]; then
            echo "ssm_path=/staging/ai/DOT_ENV" >> $GITHUB_OUTPUT
          else
            echo "ssm_path=/dev/ai/DOT_ENV" >> $GITHUB_OUTPUT
          fi

      - name: Fetch .env from Parameter Store
        run: |
          aws ssm get-parameter \
            --name "${{ steps.config.outputs.ssm_path }}" \
            --with-decryption \
            --query 'Parameter.Value' \
            --output text > .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev image & run tests
        run: |
          docker buildx build --target dev --load -t ai-test .
          docker run --env-file .env ai-test uv run pytest

  # ----------------------------
  # 2. Build & Push (Matrix x5)
  # ----------------------------
  build:
    name: Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [test]

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api_server
            ecr_repo: scuad-ai-api
            dockerfile: ./Dockerfile
            target: runtime
          - service: worker_resume
            ecr_repo: scuad-ai-worker-resume
            dockerfile: ./pipelines/resume_analysis/Dockerfile
            target: production
          - service: worker_job
            ecr_repo: scuad-ai-worker-job
            dockerfile: ./pipelines/job_analysis/Dockerfile
            target: production
          - service: worker_evaluate
            ecr_repo: scuad-ai-worker-evaluate
            dockerfile: ./pipelines/applicant_evaluation/Dockerfile
            target: production
          - service: worker_compare
            ecr_repo: scuad-ai-worker-compare
            dockerfile: ./pipelines/candidate_comparison/Dockerfile
            target: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set tag
        id: config
        run: echo "tag_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.ecr_repo }}:${{ steps.config.outputs.tag_sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ----------------------------
  # 3. Static Analysis (develop)
  # ----------------------------
  static_analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    needs: [test]
    if: >-
      github.base_ref == 'develop' ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'develop')

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Black (format check)
        run: uv run black --check .

      - name: MyPy (type check)
        run: uv run mypy .
        continue-on-error: true
